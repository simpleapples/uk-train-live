<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="UK Live Trains">
  <rect width="128" height="128" rx="28" fill="#0F172A"/>
  <!-- A curve of track: rails and sleepers -->
  <path d="M14 104 C 52 104, 60 26, 114 26" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
  <path d="M14 104 C 52 104, 60 26, 114 26" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8"/>
  <!-- Train behind, running late -->
  <circle cx="30" cy="102" r="9" fill="#E8A317" stroke="#FFFFFF" stroke-width="3"/>
  <!-- The train: a dot with its direction of travel -->
  <g transform="translate(66 62) rotate(38)">
    <circle r="21" fill="#1A9E6F" stroke="#FFFFFF" stroke-width="4.5"/>
    <path d="M0 -12 L 9.5 11 L 0 6 L -9.5 11 Z" fill="#FFFFFF"/>
  </g>
  <!-- Live -->
  <circle cx="104" cy="98" r="7" fill="#D9412B"/>
  <circle cx="104" cy="98" r="12" fill="none" stroke="#D9412B" stroke-width="2.5" opacity="0.45"/>
</svg>
