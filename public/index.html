<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UK Live Trains</title>
  <meta name="description" content="Live map of trains on the Great Britain rail network and London's TfL lines.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%231a9e6f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="map" aria-label="Map of trains"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <aside id="panel" class="panel" aria-label="Train map controls">
    <header class="panel-head">
      <h1>UK Live Trains</h1>
      <span id="notices" class="notices"></span>
      <span id="status" class="status">
        <span id="conn-dot" class="conn-dot"></span>
        <span id="conn-text" class="conn-text" hidden></span>
        <span id="clock" class="clock">--:--</span>
      </span>
    </header>

    <div class="panel-body">
      <div id="browse" class="browse">
        <div class="search">
          <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Zm0 1.6a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8Zm4.9 8.2 3.5 3.5-1.1 1.1-3.5-3.5 1.1-1.1Z"/></svg>
          <input id="search-input" type="search" placeholder="Search trains or lines" autocomplete="off" spellcheck="false"
            role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" aria-label="Search trains">
          <ul id="search-results" class="results" role="listbox" aria-label="Matching trains" hidden></ul>
        </div>

        <div id="filters" class="filters" role="group" aria-label="Networks and lines to show"></div>

        <div id="legend" class="legend" aria-label="Trains on the map"></div>
      </div>

      <section id="detail" class="detail" hidden aria-label="Selected train">
        <div class="detail-head">
          <div id="d-title" class="detail-title"></div>
          <div class="detail-actions">
            <button id="d-follow" class="icon-btn" type="button" aria-pressed="false" title="Follow this train" aria-label="Follow this train">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="5.5"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3"/></svg>
            </button>
            <button id="d-fit" class="icon-btn" type="button" title="Show whole route" aria-label="Show whole route">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5V3h4.5M12.5 3H17v4.5M17 12.5V17h-4.5M7.5 17H3v-4.5"/></svg>
            </button>
            <button id="d-close" class="icon-btn" type="button" title="Close (Esc)" aria-label="Close">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
            </button>
          </div>
        </div>
        <div id="d-route" class="d-route"></div>
        <div id="d-meta" class="d-meta"></div>

        <div class="facts">
          <div class="fact">
            <span id="d-where-lbl" class="fact-lbl">Next</span>
            <span id="d-where" class="fact-val"></span>
            <span id="d-where-time" class="fact-sub"></span>
          </div>
          <div id="d-speed-box" class="fact">
            <span class="fact-lbl">Speed</span>
            <span id="d-speed" class="fact-val"></span>
            <span id="d-speed-sub" class="fact-sub"></span>
          </div>
        </div>
        <div id="d-note" class="d-note"></div>

        <ol id="d-calls" class="calls" aria-label="Stops"></ol>
      </section>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/app.js"></script>
</body>
</html>
